<h1>Hackfleisch-Lasagne mit Spinat</h1>
<p>60 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>100 g Rinderhack</li>
<li>200 g Spinat</li>
<li>50 g Tomaten</li>
<li>100 g Lasagneblätter</li>
</ul>
<h2>So geht's</h2><ol><li>Hack mit Tomaten köcheln.</li>
<li>Mit Spinat und Blättern schichten.</li>
<li>35 Min. backen.</li></ol>
