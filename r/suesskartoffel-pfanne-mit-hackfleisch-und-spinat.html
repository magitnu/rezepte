<h1>Süsskartoffel-Pfanne mit Hackfleisch und Spinat</h1>
<p>35 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>110 g Süsskartoffeln</li>
<li>100 g Rinderhack</li>
<li>200 g Spinat</li>
</ul>
<h2>So geht's</h2><ol><li>Süsskartoffeln würfeln und braten.</li>
<li>Hack zugeben, anbraten.</li>
<li>Spinat unterheben.</li></ol>
