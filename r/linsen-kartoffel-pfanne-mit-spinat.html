<h1>Linsen-Kartoffel-Pfanne mit Spinat</h1>
<p>30 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>100 g Linsen</li>
<li>100 g Kartoffeln</li>
<li>220 g Spinat</li>
</ul>
<h2>So geht's</h2><ol><li>Kartoffeln würfeln und in Öl 10 Min. braten.</li>
<li>Linsen und Spinat zugeben.</li>
<li>5 Min. schmoren und würzen.</li></ol>
