<h1>Hackfleisch-Wirz-Wickel mit Tomatensauce und Kartoffeln</h1>
<p>60 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>100 g Rinderhack</li>
<li>150 g Wirz</li>
<li>70 g Tomaten</li>
<li>100 g Kartoffeln</li>
</ul>
<h2>So geht's</h2><ol><li>Wirzblätter blanchieren.</li>
<li>Hack füllen, einrollen.</li>
<li>In Tomatensauce 30 Min. schmoren.</li></ol>
