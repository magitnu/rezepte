<p>30 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>120 g Gurke</li>
<li>120 g Tomaten</li>
<li>2 Stück Ei</li>
<li>100 g Kartoffeln</li>
</ul>
<h2>So geht's</h2><ol><li>Kartoffeln und Eier kochen.</li>

<li>Alles mischen.</li></ol>
