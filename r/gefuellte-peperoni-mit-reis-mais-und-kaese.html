<h1>Gefüllte Peperoni mit Reis, Mais und Käse</h1>
<p>45 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>250 g Peperoni</li>
<li>30 g Reis</li>
<li>50 g Käse</li>
<li>50 g Bohnen</li>
</ul>
<h2>So geht's</h2><ol><li>Reis kochen und mit Bohnen und Käse mischen.</li>
<li>Peperoni füllen.</li>
<li>25 Min. bei 200 °C backen.</li></ol>
