<h1>Tofu-Gemüse-Wok mit Reis</h1>
<p>25 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>110 g Tofu</li>
<li>100 g Pak Choi</li>
<li>80 g Grüne Bohnen</li>
<li>60 g Peperoni</li>
<li>35 g Reis</li>
</ul>
<h2>So geht's</h2><p>Reis kochen. Tofu würfeln, knusprig braten und herausnehmen. Gemüse im Wok anbraten, Tofu und Sojasauce zugeben.</p>
