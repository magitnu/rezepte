<h1>Pouletbrust mit Rahmspinat und Reis</h1>
<p>30 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>100 g Poulet</li>
<li>220 g Spinat</li>
<li>35 g Reis</li>
</ul>
<h2>So geht's</h2><ol><li>Reis kochen. Poulet würzen und pro Seite 5 Min. braten.</li>
<li>Spinat mit Zwiebel dünsten und mit Rahm abschmecken.</li>
<li>Zusammen servieren.</li></ol>
