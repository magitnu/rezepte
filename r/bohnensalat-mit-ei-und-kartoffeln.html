<h1>Bohnensalat mit Ei und Kartoffeln</h1>
<p>30 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>150 g Grüne Bohnen</li>
<li>2 Stück Ei</li>
<li>100 g Kartoffeln</li>
<li>70 g Tomaten</li>
</ul>
<h2>So geht's</h2><p>Kartoffeln, Bohnen und Eier kochen. Alles mit Tomaten mischen und mit Essig, Öl, Senf und Zwiebel anmachen.</p>
