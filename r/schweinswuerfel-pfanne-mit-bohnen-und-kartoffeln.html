<h1>Schweinswürfel-Pfanne mit Bohnen und Kartoffeln</h1>
<p>35 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>100 g Schweinefleisch</li>
<li>200 g Grüne Bohnen</li>
<li>110 g Kartoffeln</li>
</ul>
<h2>So geht's</h2><ol><li>Kartoffeln vorkochen.</li>
<li>Fleisch anbraten, Bohnen zugeben.</li>
<li>Kartoffeln zugeben.</li></ol>
