<h1>Curry-Kartoffelsuppe mit Linsen</h1>
<p>35 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>80 g Kartoffeln</li>
<li>100 g Rote Linsen</li>
<li>50 g Rüebli</li>
<li>200 g Lauch</li>
</ul>
<h2>So geht's</h2><ol><li>Gemüse würfeln, in Öl mit Curry andünsten.</li>
<li>Linsen und Bouillon zugeben, 20 Min. köcheln.</li>
<li>Pürieren.</li></ol>
