<h1>Rindsstreifen mit Peperoni und Nudeln</h1>
<p>30 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>100 g Rindfleisch</li>
<li>200 g Peperoni</li>
<li>40 g Nudeln</li>
</ul>
<h2>So geht's</h2><ol><li>Nudeln kochen.</li>
<li>Rindfleisch scharf anbraten, Peperoni zugeben.</li>
<li>Mit Sojasauce würzen.</li></ol>
