<h1>Brokkoli-Käse-Reispfanne</h1>
<p>25 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>35 g Reis</li>
<li>200 g Brokkoli</li>
<li>60 g Käse</li>
<li>1 Stück Ei</li>
</ul>
<h2>So geht's</h2><ol><li>Reis kochen, Brokkoli dämpfen.</li>
<li>In der Pfanne mit Ei zusammenrühren.</li>
<li>Käse darüber schmelzen lassen.</li></ol>
