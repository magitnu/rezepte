<h1>Rosenkohl-Kartoffel-Pfanne mit Spiegelei</h1>
<p>35 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>110 g Kartoffeln</li>
<li>200 g Rosenkohl</li>
<li>2 Stück Ei</li>
</ul>
<h2>So geht's</h2><ol><li>Kartoffeln würfeln und vorkochen.</li>
<li>Rosenkohl halbieren und mit Kartoffeln in Öl braten.</li>
<li>Spiegeleier daraufsetzen.</li></ol>
