<h1>Schinken-Lauch-Pfanne mit Kartoffeln</h1>
<p>30 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>100 g Schinken</li>
<li>220 g Lauch</li>
<li>110 g Kartoffeln</li>
</ul>
<h2>So geht's</h2><p>Kartoffeln kochen. Lauch anbraten, Schinkenwürfel und etwas Rahm zugeben und 5 Min. köcheln. Mit den Kartoffeln servieren.</p>
