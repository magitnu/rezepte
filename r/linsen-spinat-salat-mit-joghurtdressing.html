<h1>Linsen-Spinat-Salat mit Joghurtdressing</h1>
<p>25 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>100 g Linsen</li>
<li>150 g Spinat</li>
<li>60 g Tomaten</li>
<li>10 g Joghurt</li>
<li>90 g Brot</li>
</ul>
<h2>So geht's</h2><ol><li>Linsen kochen.</li>
<li>Spinat waschen, Tomaten würfeln.</li>
<li>Mit Joghurtdressing mischen, Brot dazu.</li></ol>
