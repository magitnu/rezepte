<h1>Bratkartoffeln mit Gemüse und Tofu</h1>
<p>35 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>110 g Kartoffeln</li>
<li>110 g Tofu</li>
<li>120 g Zucchini</li>
<li>90 g Peperoni</li>
</ul>
<h2>So geht's</h2><ol><li>Kartoffeln vorkochen und braten.</li>
<li>Tofu würfeln und knusprig braten.</li>
<li>Gemüse zugeben.</li></ol>
