<h1>Chinakohl-Reispfanne mit Rührei</h1>
<p>25 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>200 g Chinakohl</li>
<li>40 g Lauch</li>
<li>2 Stück Ei</li>
<li>35 g Reis</li>
</ul>
<h2>So geht's</h2><p>Reis kochen. Lauch und Chinakohl anbraten. Eier verquirlen, in die Pfanne geben und stocken lassen, dann den Reis untermischen.</p>
