<h1>Ofenkartoffeln mit Kräuterquark und Rüeblisalat</h1>
<p>45 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>100 g Kartoffeln</li>
<li>110 g Quark</li>
<li>60 g Rüebli</li>
<li>150 g Blattsalat</li>
</ul>
<h2>So geht's</h2><ol><li>Kartoffeln backen.</li>
<li>Quark mit Kräutern mischen.</li>
<li>Rüebli raffeln, Salat anmachen.</li></ol>
