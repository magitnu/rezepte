<h1>Ei-Gemüse-Reis-Wok</h1>
<p>25 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>35 g Reis</li>
<li>2 Stück Ei</li>
<li>100 g Brokkoli</li>
<li>100 g Peperoni</li>
</ul>
<h2>So geht's</h2><ol><li>Gemüse im Wok 6 Min. braten.</li>
<li>Reis und Ei zugeben, rührend stocken lassen.</li>
<li>Mit Sojasauce würzen.</li></ol>
