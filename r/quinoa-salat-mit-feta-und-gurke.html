<h1>Quinoa-Salat mit Feta und Gurke</h1>
<p>25 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>35 g Quinoa</li>
<li>100 g Feta</li>
<li>120 g Gurke</li>
<li>100 g Tomaten</li>
</ul>
<h2>So geht's</h2><ol><li>Quinoa kochen und abkühlen.</li>
<li>Gemüse würfeln, Feta zerbröseln.</li>
<li>Mit Zitrone und Öl anmachen.</li></ol>
