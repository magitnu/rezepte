<p>35 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>30 g Reis</li>
<li>90 g Kichererbsen</li>
<li>50 g Rüebli</li>
<li>150 g Zucchini</li>
</ul>
<h2>So geht's</h2><ol><li>Zwiebel und Reis in Öl andünsten.</li>
<li>Gemüse, Kichererbsen und Bouillon zugeben.</li>
<li>Zugedeckt 15 Min. garen.</li></ol>
