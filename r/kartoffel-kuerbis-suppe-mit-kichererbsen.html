<h1>Kartoffel-Kürbis-Suppe mit Kichererbsen</h1>
<p>40 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>90 g Kartoffeln</li>
<li>200 g Kürbis</li>
<li>100 g Kichererbsen</li>
</ul>
<h2>So geht's</h2><ol><li>Gemüse würfeln, andünsten.</li>
<li>Mit Bouillon 20 Min. kochen und pürieren.</li>
<li>Gerösteten Kichererbsen darüber.</li></ol>
