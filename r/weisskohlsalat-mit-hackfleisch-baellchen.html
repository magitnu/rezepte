<h1>Weisskohlsalat mit Hackfleisch-Bällchen</h1>
<p>30 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>200 g Weisskohl</li>
<li>100 g Rinderhack</li>
<li>90 g Brot</li>
</ul>
<h2>So geht's</h2><ol><li>Kohl fein hobeln und anmachen.</li>
<li>Hackbällchen braten.</li>
<li>Mit Brot servieren.</li></ol>
