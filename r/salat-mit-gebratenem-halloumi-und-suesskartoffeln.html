<h1>Salat mit gebratenem Halloumi und Süsskartoffeln</h1>
<p>35 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>90 g Halloumi</li>
<li>100 g Süsskartoffeln</li>
<li>120 g Blattsalat</li>
<li>90 g Tomaten</li>
</ul>
<h2>So geht's</h2><ol><li>Süsskartoffeln bei 220 °C rösten.</li>
<li>Halloumi braten.</li>
<li>Auf Salat anrichten.</li></ol>
