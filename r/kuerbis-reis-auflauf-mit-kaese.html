<h1>Kürbis-Reis-Auflauf mit Käse</h1>
<p>50 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>35 g Reis</li>
<li>220 g Kürbis</li>
<li>50 g Käse</li>
<li>1 Stück Ei</li>
</ul>
<h2>So geht's</h2><ol><li>Reis kochen, Kürbis würfeln und 8 Min. dünsten.</li>
<li>Mit Ei und Käse mischen, in eine Form füllen.</li>
<li>25 Min. bei 200 °C backen.</li></ol>
