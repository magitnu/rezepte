<h1>Hackfleisch-Zucchini-Auflauf mit Kartoffeln</h1>
<p>50 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>100 g Rinderhack</li>
<li>220 g Zucchini</li>
<li>100 g Kartoffeln</li>
</ul>
<h2>So geht's</h2><ol><li>Kartoffeln vorkochen, Hack anbraten.</li>
<li>Mit Zucchini schichten.</li>
<li>Mit Käse und Milch 25 Min. backen.</li></ol>
