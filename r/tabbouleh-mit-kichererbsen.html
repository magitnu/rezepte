<p>25 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>30 g Bulgur</li>
<li>100 g Kichererbsen</li>
<li>120 g Tomaten</li>
<li>80 g Gurke</li>
<li>50 g Petersilie</li>
</ul>
