<p>60 Min. · Mengen pro Person</p>

<li>100 g Rindfleisch</li>
<li>150 g Grüne Bohnen</li>
<li>80 g Tomaten</li>

</ul>
<h2>So geht's</h2><ol><li>Fleisch anbraten, Gemüse zugeben.</li>

<li>Kartoffeln mitgaren.</li></ol>
