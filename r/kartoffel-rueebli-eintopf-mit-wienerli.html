<h1>Kartoffel-Rüebli-Eintopf mit Wienerli</h1>
<p>40 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>100 g Kartoffeln</li>
<li>60 g Rüebli</li>
<li>140 g Lauch</li>
<li>100 g Wienerli</li>
</ul>
<h2>So geht's</h2><ol><li>Gemüse würfeln, in Bouillon 20 Min. kochen.</li>
<li>Wienerli in Stücken zugeben.</li>
<li>Abschmecken.</li></ol>
