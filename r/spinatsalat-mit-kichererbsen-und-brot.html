<h1>Spinatsalat mit Kichererbsen und Brot</h1>
<p>20 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>150 g Spinat</li>
<li>100 g Kichererbsen</li>
<li>80 g Tomaten</li>
<li>90 g Brot</li>
</ul>
<h2>So geht's</h2><ol><li>Kichererbsen rösten.</li>
<li>Spinat anmachen.</li>
<li>Brot dazu.</li></ol>
