<h1>Reis-Wirz-Pfanne mit Hackfleisch</h1>
<p>35 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>35 g Reis</li>
<li>230 g Wirz</li>
<li>100 g Rinderhack</li>
</ul>
<h2>So geht's</h2><ol><li>Hack in Öl anbraten, Wirz in Streifen zugeben und 10 Min. braten.</li>
<li>Gekochten Reis untermischen.</li>
<li>Mit Kümmel und Pfeffer würzen.</li></ol>
