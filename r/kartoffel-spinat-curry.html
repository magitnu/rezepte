<h1>Kartoffel-Spinat-Curry</h1>
<p>35 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>110 g Kartoffeln</li>
<li>200 g Spinat</li>
<li>100 g Joghurt</li>
</ul>
<h2>So geht's</h2><ol><li>Kartoffeln würfeln und in Öl mit Gewürzen anbraten.</li>
<li>Wenig Wasser zugeben und 12 Min. garen.</li>
<li>Spinat zugeben und mit Joghurt servieren.</li></ol>
