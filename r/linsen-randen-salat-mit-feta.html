<h1>Linsen-Randen-Salat mit Feta</h1>
<p>30 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>80 g Linsen</li>
<li>80 g Randen</li>
<li>30 g Feta</li>
<li>100 g Blattsalat</li>
<li>70 g Gurke</li>
<li>60 g Brot</li>
</ul>
<h2>So geht's</h2><ol><li>Linsen kochen, Randen würfeln.</li>
<li>Mit Salat mischen.</li>
<li>Feta darüber, Brot dazu.</li></ol>
