<h1>Hackfleisch-Rüebli-Eintopf mit Kartoffeln</h1>
<p>45 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>100 g Rinderhack</li>
<li>80 g Rüebli</li>
<li>130 g Kohlrabi</li>
<li>100 g Kartoffeln</li>
</ul>
<h2>So geht's</h2><ol><li>Hack anbraten, Gemüse zugeben.</li>
<li>Mit Bouillon 25 Min. köcheln.</li>
<li>Würzen.</li></ol>
