<h1>Lamm-Gemüse-Eintopf mit Kartoffeln</h1>
<p>60 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>100 g Lammfleisch</li>
<li>120 g Bohnen</li>
<li>100 g Tomaten</li>
<li>100 g Kartoffeln</li>
</ul>
<h2>So geht's</h2><ol><li>Lamm anbraten, Gemüse zugeben.</li>
<li>Mit Bouillon 40 Min. schmoren.</li>
<li>Kartoffeln mitgaren.</li></ol>
