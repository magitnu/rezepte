<h1>Kartoffel-Gemüse-Frittata</h1>
<p>40 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>100 g Kartoffeln</li>
<li>2 Stück Ei</li>
<li>100 g Zucchini</li>
<li>100 g Peperoni</li>
</ul>
<h2>So geht's</h2><ol><li>Kartoffeln braten, Gemüse zugeben.</li>
<li>Eier darübergiessen.</li>
<li>Zugedeckt 8 Min. stocken lassen.</li></ol>
