<h1>Bulgur-Salat mit Halloumi</h1>
<p>30 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>30 g Bulgur</li>
<li>90 g Halloumi</li>
<li>100 g Tomaten</li>
<li>100 g Gurke</li>
<li>30 g Petersilie</li>
</ul>
<h2>So geht's</h2><ol><li>Bulgur quellen lassen.</li>
<li>Halloumi in Scheiben braten.</li>
<li>Alles mit Zitrone und Öl mischen.</li></ol>
