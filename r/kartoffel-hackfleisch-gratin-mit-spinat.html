<h1>Kartoffel-Hackfleisch-Gratin mit Spinat</h1>
<p>55 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>110 g Kartoffeln</li>
<li>100 g Rinderhack</li>
<li>200 g Spinat</li>
</ul>
<h2>So geht's</h2><ol><li>Hack anbraten und würzen.</li>
<li>Kartoffelscheiben, Spinat und Hack schichten.</li>
<li>Mit Milch übergiessen, 35 Min. backen.</li></ol>
