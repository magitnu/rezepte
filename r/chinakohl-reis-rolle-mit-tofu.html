<h1>Chinakohl-Reis-Rolle mit Tofu</h1>
<p>40 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>200 g Chinakohl</li>
<li>30 g Reis</li>
<li>110 g Tofu</li>
</ul>
<h2>So geht's</h2><ol><li>Kohlblätter blanchieren.</li>
<li>Tofu zerbröseln, mit Reis mischen und einrollen.</li>
<li>In Bouillon 15 Min. dämpfen.</li></ol>
