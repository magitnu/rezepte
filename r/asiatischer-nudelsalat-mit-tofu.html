<h1>Asiatischer Nudelsalat mit Tofu</h1>
<p>25 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>35 g Nudeln</li>
<li>110 g Tofu</li>
<li>100 g Chinakohl</li>
<li>50 g Rüebli</li>
<li>100 g Gurke</li>
</ul>
<h2>So geht's</h2><ol><li>Nudeln kochen.</li>
<li>Tofu braten, Gemüse schneiden.</li>
<li>Mit Sojasauce-Limetten-Dressing mischen.</li></ol>
