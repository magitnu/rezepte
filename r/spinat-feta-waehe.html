<h1>Spinat-Feta-Wähe</h1>
<p>50 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>90 g Teig</li>
<li>200 g Spinat</li>
<li>50 g Feta</li>
<li>1 Stück Ei</li>
</ul>
<h2>So geht's</h2><p>Spinat andünsten und mit Feta auf den Teig geben. Eier mit Milch verquirlen, darübergiessen und 30 Min. bei 200 °C backen.</p>
