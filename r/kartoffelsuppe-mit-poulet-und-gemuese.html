<h1>Kartoffelsuppe mit Poulet und Gemüse</h1>
<p>40 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>100 g Kartoffeln</li>
<li>100 g Poulet</li>
<li>50 g Rüebli</li>
<li>140 g Lauch</li>
</ul>
<h2>So geht's</h2><ol><li>Gemüse würfeln und in Bouillon 15 Min. kochen.</li>
<li>Poulet zugeben, 10 Min. garen und zerzupfen.</li>
<li>Abschmecken.</li></ol>
