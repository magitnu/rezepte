<h1>Kartoffel-Frittata mit Spinat und Feta</h1>
<p>35 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>100 g Kartoffeln</li>
<li>2 Stück Ei</li>
<li>20 g Feta</li>
<li>220 g Spinat</li>
</ul>
<h2>So geht's</h2><ol><li>Kartoffeln in Scheiben braten, Spinat zugeben.</li>
<li>Eier mit Feta darübergiessen.</li>
<li>Zugedeckt stocken lassen.</li></ol>
