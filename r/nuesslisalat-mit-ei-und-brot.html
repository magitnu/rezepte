<h1>Nüsslisalat mit Ei und Brot</h1>
<p>20 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>150 g Nüsslisalat</li>
<li>50 g Rüebli</li>
<li>2 Stück Ei</li>
<li>60 g Gurke</li>
<li>90 g Brot</li>
</ul>
<h2>So geht's</h2><p>Eier 8 Min. kochen. Nüsslisalat waschen und mit Rüebli und Gurke anmachen. Eier halbieren und Brot dazu servieren.</p>
