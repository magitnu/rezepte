<h1>Rotkohl-Reispfanne mit Poulet</h1>
<p>35 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>35 g Reis</li>
<li>220 g Rotkohl</li>
<li>100 g Poulet</li>
</ul>
<h2>So geht's</h2><ol><li>Poulet braten, Rotkohl in Streifen 10 Min. mitbraten.</li>
<li>Reis kochen und untermischen.</li>
<li>Mit Essig und Pfeffer würzen.</li></ol>
