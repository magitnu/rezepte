<h1>Süsskartoffel-Brokkoli-Blech mit Feta</h1>
<p>40 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>110 g Süsskartoffeln</li>
<li>200 g Brokkoli</li>
<li>100 g Feta</li>
</ul>
<h2>So geht's</h2><ol><li>Süsskartoffelwürfel bei 220 °C 15 Min. rösten.</li>
<li>Brokkoli zugeben, 15 Min. weiter rösten.</li>
<li>Feta darüber.</li></ol>
