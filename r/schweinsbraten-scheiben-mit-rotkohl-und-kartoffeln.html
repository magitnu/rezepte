<h1>Schweinsbraten-Scheiben mit Rotkohl und Kartoffeln</h1>
<p>45 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>100 g Schweinefleisch</li>
<li>220 g Rotkohl</li>
<li>110 g Kartoffeln</li>
</ul>
<h2>So geht's</h2><ol><li>Rotkohl mit Zwiebel 25 Min. schmoren.</li>
<li>Fleisch braten.</li>
<li>Kartoffeln kochen.</li></ol>
