<p>30 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>25 g Reis</li>
<li>200 g Tomaten</li>
<li>50 g Zucchini</li>
<li>100 g Mozzarella</li>
</ul>
<h2>So geht's</h2><ol><li>Tomaten und Zucchini in Bouillon 10 Min. kochen.</li>
<li>Reis zugeben, 10 Min. garen.</li>
