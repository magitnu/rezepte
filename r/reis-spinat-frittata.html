<h1>Reis-Spinat-Frittata</h1>
<p>35 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>30 g Reis</li>
<li>200 g Spinat</li>
<li>2 Stück Ei</li>
</ul>
<h2>So geht's</h2><ol><li>Reis kochen, Spinat dünsten.</li>
<li>Mit Ei mischen und in der Pfanne zugedeckt 10 Min. stocken lassen.</li>
<li>Mit Salat servieren.</li></ol>
