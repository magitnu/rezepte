<h1>Kichererbsen-Fladenbrot-Salat</h1>
<p>20 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>100 g Kichererbsen</li>
<li>90 g Fladenbrot</li>
<li>100 g Tomaten</li>
<li>100 g Gurke</li>
<li>20 g Petersilie</li>
</ul>
<h2>So geht's</h2><ol><li>Fladenbrot rösten und würfeln.</li>
<li>Gemüse schneiden.</li>
<li>Alles mischen.</li></ol>
