<h1>Kartoffel-Wirz-Pfanne mit Wienerli</h1>
<p>35 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>110 g Kartoffeln</li>
<li>220 g Wirz</li>
<li>100 g Wienerli</li>
</ul>
<h2>So geht's</h2><ol><li>Kartoffeln vorkochen und würfeln.</li>
<li>Wirz in Streifen braten.</li>
<li>Wienerli in Scheiben dazu, alles mischen.</li></ol>
