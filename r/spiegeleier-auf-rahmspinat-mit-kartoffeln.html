<h1>Spiegeleier auf Rahmspinat mit Kartoffeln</h1>
<p>25 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>2 Stück Ei</li>
<li>220 g Spinat</li>
<li>110 g Kartoffeln</li>
</ul>
<h2>So geht's</h2><p>Kartoffeln kochen. Spinat mit etwas Rahm oder Milch dünsten und würzen. Spiegeleier braten und auf den Spinat legen.</p>
