<h1>Kartoffelstock mit Rahmspinat und Spiegelei</h1>
<p>30 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>110 g Kartoffeln</li>
<li>220 g Spinat</li>
<li>2 Stück Ei</li>
<li>30 g Rahm</li>
</ul>
<h2>So geht's</h2><ol><li>Kartoffeln kochen und stampfen.</li>
<li>Spinat mit etwas Rahm dünsten.</li>
<li>Spiegeleier braten und anrichten.</li></ol>
