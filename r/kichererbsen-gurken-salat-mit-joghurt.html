<h1>Kichererbsen-Gurken-Salat mit Joghurt</h1>
<p>15 Min. · Mengen pro Person</p>
<h2>Zutaten</h2><ul>
<li>110 g Kichererbsen</li>
<li>150 g Gurke</li>
<li>80 g Tomaten</li>
<li>10 g Joghurt</li>
<li>90 g Fladenbrot</li>
</ul>
<h2>So geht's</h2><ol><li>Kichererbsen abspülen.</li>
<li>Gemüse würfeln.</li>
<li>Mit Joghurtdressing mischen, Brot dazu.</li></ol>
